<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Live Scenario — Patient View</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; height: 100dvh; overflow: hidden; background: linear-gradient(135deg, #2C4F7C 0%, #4E7FAE 55%, #6FA0CC 100%); color: #1e2a36; font-family: 'Courier New', monospace; }
body { display: flex; flex-direction: column; }
#topbar { flex-shrink: 0; background: #ffffff; border-bottom: 2px solid #d7dee6; padding: 8px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
#topbar .title { font-size: 12px; font-weight: 900; letter-spacing: 1px; color: #0369a1; text-transform: uppercase; }
#topbar-right { display: flex; align-items: center; gap: 14px; }
#instant-mode-label { font-size: 10px; display: flex; align-items: center; gap: 4px; color: #33475a; cursor: pointer; user-select: none; }
#scenario-timer { font-size: 13px; font-weight: 700; color: #15803d; }
#patient-info { flex-shrink: 0; }
#main { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 10px; overflow: hidden; }
@media (min-width: 800px) { #main { flex-direction: row; } }
.panel { background: #ffffff; border: 1px solid #d7dee6; border-radius: 8px; padding: 10px; }
#monitor-col { background: #0a0e16 !important; border-color: #142235 !important; min-height: 0; }
#info-col { flex: 1; max-width: 280px; display: flex; flex-direction: column; gap: 10px; min-width: 0; min-height: 0; }
#patient-info h2 { font-size: 12px; color: #0369a1; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
#patient-info .row { font-size: 12px; color: #33475a; margin-bottom: 3px; }
#patient-graphic { flex: 1; min-height: 100px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
#patient-graphic img { max-width: 100%; max-height: 100%; object-fit: contain; }

/* Monitor main row (ECG + narrow vitals sidebar side-by-side, matching monitor.html) */
#monitor-main { display: flex; flex-direction: row; flex: 1; min-height: 0; overflow: hidden; border-bottom: 2px solid #0d1f35; }
#ecg-section { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #060606; overflow: hidden; border-right: 2px solid #0d1f35; }
.ecg-section-bar { display: flex; align-items: center; justify-content: space-between; padding: 6px 12px; background: #060910; border-bottom: 1px solid #0d1f35; font-size: 10px; letter-spacing: 1.5px; color: #00ff88; text-transform: uppercase; flex-shrink: 0; }
.ecg-snapshot-btn { background: rgba(0,255,136,0.08); border: 2px solid #00ff88; color: #00ff88; font-family: 'Courier New', monospace; font-size: 11px; font-weight: bold; letter-spacing: 1px; padding: 4px 12px; cursor: pointer; text-transform: uppercase; border-radius: 4px; }
.ecg-snapshot-btn:disabled { opacity: 0.5; cursor: default; }
#ecg-display-wrap { position: relative; flex: 1; min-height: 0; overflow: hidden; }
#ecg-12lead-container { width: 100%; height: 100%; overflow: hidden; cursor: pointer; }
#ecg-apply-overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(6,9,16,0.94); text-align: center; padding: 10px; z-index: 5; }
.ecg-overlay-text { color: #00ff88; font-size: 12px; letter-spacing: 1px; }
.apply-btn-lg { background: rgba(0,255,136,0.1); border: 2px solid #00ff88; color: #00ff88; font-family: 'Courier New', monospace; font-size: 12px; font-weight: bold; padding: 10px 18px; border-radius: 6px; cursor: pointer; letter-spacing: 1px; }
#ecg-progress-banner { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.75); color: #00ff88; font-size: 10px; text-align: center; padding: 3px 6px; letter-spacing: 1px; display: none; z-index: 6; pointer-events: none; }

/* Vitals sidebar — narrow column beside the ECG, each block flex:1 (matches monitor.html #vitals-panel) */
#monitor-box { width: 150px; flex-shrink: 0; display: flex; flex-direction: column; background: #080c14; overflow: hidden; }
.vblock { flex: 1; min-height: 0; display: flex; flex-direction: column; border-bottom: 2px solid #0d1f35; padding: 3px 8px; overflow: hidden; cursor: pointer; -webkit-tap-highlight-color: rgba(255,255,255,0.15); }
.vblock:active { background: rgba(255,255,255,0.06); }
.vlabel { font-size: 8px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; flex-shrink: 0; }
.vvalue { flex: 1; display: flex; align-items: center; font-size: clamp(16px, 2.8vw, 28px); font-weight: 900; line-height: 1; font-family: 'Courier New', monospace; min-height: 0; overflow: hidden; }
.vunit { font-size: 8px; font-weight: 400; opacity: 0.7; margin-left: 3px; align-self: flex-end; }
.v-hr   .vlabel { color: #ffffff; } .v-hr   .vvalue { color: #ffffff; }
.v-bp   .vlabel { color: #7fff00; } .v-bp   .vvalue { color: #7fff00; }
.v-spo2 .vlabel { color: #4fc3f7; } .v-spo2 .vvalue { color: #4fc3f7; }
.v-rr   .vlabel { color: #ffd54f; } .v-rr   .vvalue { color: #ffd54f; }
.v-etco2 .vlabel { color: #ff8a65; } .v-etco2 .vvalue { color: #ff8a65; }
#bp-timer { font-size: 7px; color: #4a6a8a; }
.apply-btn { font-size: 8px; background: none; border: 1px solid currentColor; border-radius: 3px; padding: 2px 5px; cursor: pointer; color: inherit; font-family: inherit; }
.tap-hint { font-size: 10px; opacity: 0.8; font-style: italic; }
.pending-txt { font-size: 10px; opacity: 0.85; }
.queued-txt { font-size: 9px; opacity: 0.7; font-style: italic; }

#oneoff-strip { display: flex; flex-wrap: wrap; gap: 0; border-top: 2px solid #0d1f35; }
.oo-card { flex: 1; min-width: 90px; padding: 6px 8px; border-right: 1px solid #1a2a3a; border-bottom: 1px solid #1a2a3a; cursor: pointer; -webkit-tap-highlight-color: rgba(255,255,255,0.15); }
.oo-card:active { background: rgba(255,255,255,0.06); }
.oo-label { font-size: 8px; font-weight: 700; color: #4a6a8a; text-transform: uppercase; letter-spacing: 1px; }
.oo-value { font-size: 15px; font-weight: 700; color: #c0d4e8; }
.oo-tap-again { font-size: 8px; color: #4fc3f7; margin-top: 2px; font-style: italic; }
.oo-pending { font-size: 10px; color: #4fc3f7; margin-top: 2px; }
.oo-queued { font-size: 9px; color: #6b8299; margin-top: 2px; font-style: italic; }

/* Voice capture — Give Treatment / Talk to Patient ------------------------ */
#voice-fab-strip { display: flex; flex-direction: row; gap: 6px; flex-shrink: 0; width: 100%; max-width: 240px; }
.voice-fab { flex: 1; min-height: 26px; display: flex; align-items: center; justify-content: center; gap: 4px; border-radius: 7px; border: none; background: #0369a1; color: #fff; font-family: 'Courier New', monospace; font-weight: 700; font-size: 10px; letter-spacing: 0.3px; cursor: pointer; padding: 4px 6px; -webkit-tap-highlight-color: rgba(255,255,255,0.2); }
.voice-fab svg { width: 11px; height: 11px; flex-shrink: 0; fill: currentColor; }
.voice-fab:active { background: #075985; }
#voice-fab-chat { background: #15803d; }
#voice-fab-chat:active { background: #14532d; }
#voice-fab-exam { background: #7c3aed; }
#voice-fab-exam:active { background: #5b21b6; }

/* Floating head + mic badge — mic sits just above/right of the gif, flat
   red icon, invisible unless actively listening (toggled via .listening,
   same mechanism as before — just relocated and restyled). */
#head-wrap { position: relative; display: inline-block; line-height: 0; }
#voice-mic-indicator { display: none; position: absolute; top: -8px; right: -8px; width: 22px; height: 22px; align-items: center; justify-content: center; background: #fff; border-radius: 50%; box-shadow: 0 1px 4px rgba(0,0,0,0.3); }
#voice-mic-indicator svg { width: 13px; height: 13px; fill: #dc2626; }
#voice-mic-indicator.listening { display: flex; animation: micBlink 1s steps(1) infinite; }
@keyframes micBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

/* Voice UI takes over the "Patient / Scene Info" panel while active (a
   speech-bubble sits right above the patient graphic anyway), instead of a
   dark modal overlay — the rest of the page (monitor, vitals, one-offs)
   stays fully visible and interactive throughout, so a BP or GCS can still
   be taken mid-conversation. #patient-info-voice is display:none by
   default; openVoiceModal()/closeVoiceModal() toggle which of the two
   sits visible inside the #patient-info panel. */
#patient-info-voice { display: none; gap: 10px; align-items: flex-start; }
#patient-info-voice-text { flex: 1; min-width: 0; }
#voice-modal-title-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
#voice-modal-title { font-size: 11px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; color: #0369a1; }
#input-mode-toggle { margin-left: auto; display: flex; gap: 4px; flex-shrink: 0; }
.mode-pill { font-family: 'Courier New', monospace; font-size: 9px; font-weight: 700; padding: 3px 7px; border-radius: 20px; border: 1px solid #d7dee6; background: #f7fafc; color: #33475a; cursor: pointer; white-space: nowrap; }
.mode-pill.active { background: #0369a1; color: #fff; border-color: #0369a1; }
#voice-modal-status { font-size: 11px; color: #33475a; margin-bottom: 4px; min-height: 14px; }
#voice-modal-transcript { min-height: 20px; border: 1px solid #d7dee6; border-radius: 6px; padding: 6px 8px; font-size: 13px; color: #1e2a36; margin-bottom: 4px; background: #f7fafc; }
#type-input-row { display: none; gap: 6px; margin-bottom: 4px; }
#type-input-row input { flex: 1; min-width: 0; font-size: 13px; padding: 6px 8px; border: 1px solid #d7dee6; border-radius: 6px; font-family: 'Courier New', monospace; }
#type-input-row .voice-btn { width: auto; padding: 0 12px; min-height: 34px; }
#patient-reply-display { font-size: 13px; color: #15803d; margin-bottom: 0; font-style: italic; display: none; }
#voice-modal-actions { display: flex; flex-direction: column; gap: 6px; width: 92px; flex-shrink: 0; }
.voice-btn { min-height: 40px; border-radius: 6px; border: none; font-family: 'Courier New', monospace; font-weight: 700; font-size: 12px; cursor: pointer; }
.voice-btn-primary { background: #0369a1; color: #fff; }
.voice-btn-primary:disabled { opacity: 0.4; }
.voice-btn-secondary { background: #e2e8f0; color: #33475a; }
</style>
</head>
<body>
<div id="topbar">
  <div class="title">Live Scenario — Patient View</div>
  <div id="topbar-right">
    <span id="pause-indicator" style="font-size:11px;font-weight:700;color:#b45309;display:none;">&#9208; PAUSED</span>
    <span id="instant-mode-indicator" style="font-size:10px;color:#33475a;display:none;">Instant Mode: ON</span>
    <div id="scenario-timer">00:00</div>
  </div>
</div>
<div id="session-gate" style="position:fixed;inset:0;background:rgba(20,30,45,0.92);z-index:100;display:flex;align-items:center;justify-content:center;">
  <div class="panel" style="width:280px;text-align:center;">
    <h2 style="margin-bottom:10px;">Join Scenario Session</h2>
    <input id="gate-code-input" type="text" inputmode="numeric" maxlength="6" placeholder="6-digit code" style="width:100%;font-size:18px;text-align:center;letter-spacing:4px;padding:8px;border:1px solid #d7dee6;border-radius:6px;font-family:'Courier New',monospace;margin-bottom:8px;">
    <button style="width:100%;padding:8px;font-size:13px;font-weight:700;color:#fff;background:#0369a1;border:none;border-radius:6px;cursor:pointer;" onclick="connectSession(document.getElementById('gate-code-input').value.trim())">Connect</button>
    <div id="gate-error" style="color:#b91c1c;font-size:11px;margin-top:8px;"></div>
  </div>
</div>
<div class="panel" id="patient-info" style="margin:10px 10px 0;">
  <div id="patient-info-normal">
    <h2>Patient / Scene Info</h2>
    <div class="row" id="pi-demographics">45yo Male</div>
    <div class="row" id="pi-dispatch">Dispatch: Chest pain, 2 hrs onset</div>
    <div class="row" id="pi-complaint">C/O: Central chest pain radiating to left arm, diaphoretic</div>
  </div>
  <div id="patient-info-voice">
    <div id="patient-info-voice-text">
      <div id="voice-modal-title-row">
        <span id="voice-modal-title">Give Treatment</span>
        <span id="input-mode-toggle">
          <button type="button" class="mode-pill" id="mode-pill-speech" onclick="setInputMode('speech')">&#127908; Speech</button>
          <button type="button" class="mode-pill" id="mode-pill-type" onclick="setInputMode('type')">&#8996; Type</button>
        </span>
      </div>
      <div id="voice-modal-status">Listening&hellip;</div>
      <div id="voice-modal-transcript"></div>
      <div id="type-input-row">
        <input type="text" id="type-input" placeholder="Type here&hellip;" autocomplete="off" onkeydown="if(event.key==='Enter'){event.preventDefault();sendTypedText();}">
        <button type="button" class="voice-btn voice-btn-primary" id="type-send-btn" onclick="sendTypedText()">Send</button>
      </div>
      <div id="patient-reply-display"></div>
    </div>
    <div id="voice-modal-actions">
      <button class="voice-btn voice-btn-secondary" onclick="restartVoiceCapture()">Try Again</button>
      <button class="voice-btn voice-btn-secondary" onclick="closeVoiceModal()">Cancel</button>
    </div>

</div>
<div id="main">
  <div id="monitor-col" class="panel" style="flex:2;min-width:0;padding:0;overflow:hidden;display:flex;flex-direction:column;">
    <div id="monitor-main">

<script>
// --- Supabase session sync ------------------------------------------------
const SUPABASE_URL = 'https://befsjenbaruxqrntuhpn.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJlZnNqZW5iYXJ1eHFybnR1aHBuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI2MjA5MjAsImV4cCI6MjA4ODE5NjkyMH0.hOFFbIvd1wAgu-QyghupQ-7ttSpg7sxz_UsJbXyXztA';

async function sbGet(path) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function sbPatch(path, body) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    method: 'PATCH',
    headers: {
      'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json', 'Prefer': 'return=minimal'
    },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
}

let testConfig = null; // populated once a session is joined — see connectSession()
let instantMode = false; // synced from the session row; assessor-controlled, not editable here
// Temp/BGL/Ketones/Pain/GCS now go through the same overrides mechanism as
// HR/BP/etc — read the current projected value straight from the engine.
function extendedVitalsNow() {
  return SimEngine.getVitalsRaw(testConfig, SimEngine.getSimNow(testConfig, Date.now()));
}

// --- Dynamic patient avatar -------------------------------------------------
// Entirely local/deterministic — no AI, no image generation. A "build" (skin
// tone, hair colour/style) is picked once per scenario and stays fixed for
// the session; live "state" (eyes/mouth/skin tint/sweat) is re-derived every
// tick from SimEngine.getAppearanceState(), the same severity bands
// sim_control.html's assessor-facing Appearance tab uses — see sim_engine.js.
let avatarBuild = { skin: '#E0AC81', hairColour: '#3b2b20', hairStyle: 'medium', gender: null };
const HAIR_COLOURS = ['#1b1410', '#3b2b20', '#5a3b23', '#8a5a2b', '#c9a227', '#8c8c8c', '#7a2e1d'];

function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}

// seed drives hair colour/style so it's stable for a given scenario across
// reconnects, rather than re-rolling randomly on every page load.
function buildAvatarBase(seed, gender, skinHex) {
  avatarBuild.skin = skinHex || avatarBuild.skin;
  avatarBuild.gender = gender || avatarBuild.gender;
  const h = hashStr(String(seed || sessionCode || 'default'));
  avatarBuild.hairColour = HAIR_COLOURS[h % HAIR_COLOURS.length];
  const g = (avatarBuild.gender || '').toLowerCase();
  avatarBuild.hairStyle = g === 'male' ? 'short' : g === 'female' ? 'long' : (h % 2 === 0 ? 'medium' : 'short');
  renderAvatarBuild();
}

function renderAvatarBuild() {
  document.getElementById('av-hair-cap').setAttribute('fill', avatarBuild.hairColour);
  document.getElementById('av-hair-side-l').setAttribute('fill', avatarBuild.hairColour);
  document.getElementById('av-hair-side-r').setAttribute('fill', avatarBuild.hairColour);
  const showSides = avatarBuild.hairStyle === 'long';
  document.getElementById('av-hair-side-l').style.display = showSides ? '' : 'none';
  document.getElementById('av-hair-side-r').style.display = showSides ? '' : 'none';
  document.getElementById('av-hair-clip-rect').setAttribute('height', avatarBuild.hairStyle === 'short' ? 62 : 80);
  applySkinTint('normal'); // base skin tone shown immediately, before the first live tick
}

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function blendHex(baseHex, targetHex, t) {
  const [br, bg, bb] = hexToRgb(baseHex), [tr, tg, tb] = hexToRgb(targetHex);
  const r = Math.round(br + (tr - br) * t), g = Math.round(bg + (tg - bg) * t), b = Math.round(bb + (tb - bb) * t);
  return `rgb(${r},${g},${b})`;
}
// Tint targets are blended toward, not swapped to — keeps each patient's own
// base skin tone visible under the clinical tint instead of flattening
// everyone to the same "cyanotic blue"/"pale grey".
const SKIN_TINTS = { cyanotic: { hex: '#4f6f92', t: 0.55 }, mottled: { hex: '#8a7590', t: 0.4 }, pale: { hex: '#e4dcd2', t: 0.5 }, normal: null };
function applySkinTint(state) {
  const tint = SKIN_TINTS[state];
  const fill = tint ? blendHex(avatarBuild.skin, tint.hex, tint.t) : avatarBuild.skin;
  document.getElementById('av-head').setAttribute('fill', fill);
  document.getElementById('av-neck').setAttribute('fill', fill);
}

function setEyeOpenness(level) {
  const ry = level === 'open' ? 11 : level === 'droopy' ? 4.5 : 0.8;
  const pupilOpacity = level === 'closed' ? 0 : level === 'droopy' ? 0.5 : 1;
  document.getElementById('av-eye-l-white').setAttribute('ry', ry);
  document.getElementById('av-eye-r-white').setAttribute('ry', ry);
  document.getElementById('av-eye-l-pupil').style.opacity = pupilOpacity;
  document.getElementById('av-eye-r-pupil').style.opacity = pupilOpacity;
}

function setSweat(visible) {
  document.getElementById('av-sweat').style.display = visible ? '' : 'none';
}

// talkOpen/talkClosed are the two frames the TTS-driven talking animation
// alternates between (see startTalkAnimation()) — every other state is a
// resting expression driven by pain/distress/consciousness.
const MOUTH_STATES = {
  neutral:    { d: 'M78 148 Q100 152 122 148', fill: 'none', stroke: '#7a3b3b', sw: 4 },
  mild:       { d: 'M80 150 Q100 147 120 150', fill: 'none', stroke: '#7a3b3b', sw: 4 },
  grimace:    { d: 'M76 149 L85 153 L93 147 L100 153 L107 147 L115 153 L124 149', fill: 'none', stroke: '#7a3b3b', sw: 3 },
  distress:   { d: 'M82 143 Q100 141 118 143 Q121 157 100 159 Q79 157 82 143 Z', fill: '#5a2020', stroke: 'none', sw: 0 },
  slack:      { d: 'M79 145 Q100 142 121 145 Q124 161 100 164 Q76 161 79 145 Z', fill: '#4a2222', stroke: 'none', sw: 0 },
  talkOpen:   { d: 'M84 145 Q100 143 116 145 Q118 155 100 157 Q82 155 84 145 Z', fill: '#5a2020', stroke: 'none', sw: 0 }
};
function setMouth(stateKey) {
  const st = MOUTH_STATES[stateKey] || MOUTH_STATES.neutral;
  const el = document.getElementById('av-mouth');
  el.setAttribute('d', st.d);
  el.setAttribute('fill', st.fill);
  el.setAttribute('stroke', st.stroke);
  el.setAttribute('stroke-width', st.sw);
}

// Live per-tick state — resting expression is computed regardless of whether
// the crew has actually assessed pain/GCS in-fiction (same model
// sim_control.html's Appearance tab uses: continuously live, not gated on
// what's been "asked for" yet).
let _restingMouthState = 'neutral';
function updateAvatarFace(v) {
  const app = SimEngine.getAppearanceState(v);
  const eyeLevel = (app.unresponsive || app.gcsE <= 1) ? 'closed' : app.gcsE === 2 ? 'droopy' : 'open';
  setEyeOpenness(eyeLevel);
  applySkinTint(app.skinColour);
  setSweat(app.moisture === 'diaphoretic' || app.moisture === 'clammy');
  let mouthState;
  if (app.unresponsive) mouthState = 'slack';
  else if (app.pain >= 7) mouthState = 'grimace';
  else if (app.distressLevel >= 2) mouthState = 'distress';
  else if (app.distressLevel === 1 || app.pain >= 1) mouthState = 'mild';
  else mouthState = 'neutral';
  _restingMouthState = mouthState;
  if (!_isSpeaking) setMouth(mouthState);
}

// Mouth-flap animation while patient TTS is actually playing — hooked from
// checkForPatientReply()'s speechSynthesis calls below. Alternates back to
// the current resting expression (not always neutral) between open frames,
// so a distressed/grimacing patient still looks distressed while talking.
let _isSpeaking = false;
let _talkAnimTimer = null;
function startTalkAnimation() {
  _isSpeaking = true;
  if (_talkAnimTimer) return;
  let open = false;
  _talkAnimTimer = setInterval(() => {
    open = !open;
    setMouth(open ? 'talkOpen' : _restingMouthState);
  }, 160);
}
function stopTalkAnimation() {
  _isSpeaking = false;
  if (_talkAnimTimer) { clearInterval(_talkAnimTimer); _talkAnimTimer = null; }
  setMouth(_restingMouthState);
}

// --- Session join flow -----------------------------------------------------
async function connectSession(code) {
  const errEl = document.getElementById('gate-error');
  errEl.textContent = '';
  try {
    const rows = await sbGet(`sim_sessions?session_code=eq.${encodeURIComponent(code)}&select=*`);
    if (!rows.length) { errEl.textContent = 'No session found with that code.'; return; }
    const row = rows[0];
    testConfig = {
      baseline: row.baseline,
      startTimeMs: row.start_time_ms,
      treatments: row.treatments || [],
      overrides: row.overrides || {},
      instantMode: row.instant_mode,
      hasStarted: row.has_started,
      isPaused: row.is_paused,
      pausedAtMs: row.paused_at_ms,
      totalPausedMs: row.total_paused_ms
    };
    instantMode = row.instant_mode;
    actionControls = row.action_controls || {};
    sessionCode = code;
    document.getElementById('session-gate').style.display = 'none';
    requestMicPermissionEarly();
    buildAvatarBase(row.scenario_id, null, null); // sensible defaults up front; refined below once scenario meta arrives
    sbPatch(`sim_sessions?session_code=eq.${encodeURIComponent(code)}`, { patient_connected: true, updated_at: new Date().toISOString() })
      .catch(() => {}); // best-effort — control just falls back to showing the join panel if this fails
    // Best-effort only — patient_meta.gender/skin_colour drive the avatar's
    // build (see buildAvatarBase()); gender also biases TTS voice selection.
    // Older scenarios predate patient_meta.gender, so fall back to the same
    // title-sniffing heuristic used before this existed.
    if (row.scenario_id) {
      sbGet(`scenarios?id=eq.${encodeURIComponent(row.scenario_id)}&select=title,patient_meta`)
        .then(rows2 => {
          const scen = rows2[0] || {};
          const meta = scen.patient_meta || {};
          let gender = (meta.gender || '').toLowerCase() || null;
          if (!gender) {
            const title = scen.title || '';
            if (/\bfemale\b/i.test(title)) gender = 'female';
            else if (/\bmale\b/i.test(title)) gender = 'male';
          }
          if (gender === 'male' || gender === 'female') patientGender = gender;
          buildAvatarBase(row.scenario_id, gender, meta.skin_colour);
        })
        .catch(() => {});
    }
    tick();
    setInterval(tick, 1000);
    setInterval(pollSession, 3000);
  } catch (e) {
    errEl.textContent = 'Could not reach the session — check the code and try again.';
  }
}

let sessionCode = null;
// Assessor-side pause/skip commands for individual student actions, read
// here and applied in tick() — see "Action delay/reveal system" below.
// paused: bool, frozen while true (see tick()). skipEpoch: monotonically
// increasing counter — a rise means "the assessor clicked skip since I last
// looked", so no ack/clear round-trip is needed to avoid a write race with
// this page's own patient_actions writes (see pushActionState()).
let actionControls = {};
const _processedSkipEpoch = {};
async function pollSession() {
  if (!sessionCode || !testConfig) return;
  try {
    const rows = await sbGet(`sim_sessions?session_code=eq.${encodeURIComponent(sessionCode)}&select=treatments,overrides,instant_mode,has_started,is_paused,paused_at_ms,total_paused_ms,action_controls,patient_reply`);
    if (!rows.length) return;
    const row = rows[0];
    testConfig.treatments = row.treatments || [];
    testConfig.overrides = row.overrides || {};
    testConfig.instantMode = row.instant_mode;
    testConfig.hasStarted = row.has_started;
    testConfig.isPaused = row.is_paused;
    testConfig.pausedAtMs = row.paused_at_ms;
    testConfig.totalPausedMs = row.total_paused_ms;
    instantMode = row.instant_mode;
    actionControls = row.action_controls || {};
    checkForPatientReply(row.patient_reply);
  } catch (e) { /* transient network hiccup — try again next poll */ }
}

// --- Action delay/reveal system, with a 2-crew concurrency limit ---------
// Status lifecycle: idle -> (queued ->) pending -> done
// Only MAX_CONCURRENT actions may be 'pending' (a crew member actively doing
// it) at once; further requests wait as 'queued' until a slot frees up.
const MAX_CONCURRENT = 2;
let actionQueue = [];
const actionState = {};
['ecg','ecg12lead','rr','spo2','etco2','bp','temp','gcs','bgl','ketones','pain'].forEach(k => {
  actionState[k] = { status: 'idle' };
});

const oneOffDefs = {
  temp:    { label: 'Temp',    unit: '\u00b0C' },
  gcs:     { label: 'GCS',     unit: '/15' },
  bgl:     { label: 'BGL',     unit: 'mmol/L' },
  ketones: { label: 'Ketones', unit: 'mmol/L' },
  pain:    { label: 'Pain',    unit: '/10' }
};

// Human-readable labels for every actionState key — used when pushing state
// to Supabase for sim_control.html's Actions tab (see pushActionState()).
const ACTION_LABELS = {
  ecg: 'ECG (Lead II)', ecg12lead: '12-Lead ECG', rr: 'Resp Rate', spo2: 'SpO\u2082',
  etco2: 'EtCO\u2082', bp: 'Blood Pressure', temp: 'Temperature', gcs: 'GCS',
  bgl: 'BGL', ketones: 'Ketones', pain: 'Pain Score'
};
function formatStaticVital(key, val) {
  if (val == null) return '\u2014';
  if (key === 'gcs') return `${val}`; // already summed to a total before this is called
  if (key === 'temp' || key === 'bgl' || key === 'ketones') return val.toFixed(1);
  return `${Math.round(val)}`;
}

function countPending() {
  return Object.values(actionState).filter(s => s.status === 'pending').length;
}

function tryStartQueued() {
  while (countPending() < MAX_CONCURRENT && actionQueue.length > 0) {
    const key = actionQueue.shift();
    if (actionState[key] && actionState[key].status === 'queued') beginPending(key);
  }
}

function startAction(key) {
  const st = actionState[key];
  if (!st || st.status !== 'idle') return;
  if (countPending() < MAX_CONCURRENT) {
    beginPending(key);
  } else {
    st.status = 'queued';
    actionQueue.push(key);
  }
}

function beginPending(key) {
  const st = actionState[key];
  const now = Date.now();
  const context = { ecgApplied: actionState.ecg.status === 'done' };
  const durSec = SimEngine.getActionDurationSec(key, context);
  const durMs = instantMode ? 0 : durSec * 1000;
  if (key === 'bp') {
    const v = SimEngine.getVitals(testConfig, SimEngine.getSimNow(testConfig, now));
    st.targetSys = v.BPsys;
  }
  if (durMs <= 0) {
    st.status = 'done';
    onActionComplete(key, now);
    tryStartQueued();
  } else {
    st.status = 'pending';
    st.startedAt = now;
    st.completesAt = now + durMs;
  }
}

function onActionComplete(key, now) {
  if (key === 'ecg12lead') {
    if (actionState.ecg.status !== 'done') actionState.ecg.status = 'done';
    _show12Lead = true;
    _limbLeadIndex = 1; // back to 'II' baseline once full 12-lead is available
    if (_ecgInst) _ecgInst.setStripLead('II');
  }
  if (key === 'bp') {
    const v = SimEngine.getVitals(testConfig, SimEngine.getSimNow(testConfig, now));
    lastBP = { sys: v.BPsys, dia: v.BPdia };
    bpNextDueMs = now + bpIntervalMin * 60000;
  }
  if (oneOffDefs[key]) {
    const v = extendedVitalsNow();
    actionState[key].value = key === 'gcs' ? Math.round(v.gcsE + v.gcsV + v.gcsM) : v[key];
  }
}

function reassess(key) {
  actionState[key].status = 'idle';
  startAction(key);
}

// Applies assessor pause/skip commands (see actionControls, polled every
// 3s) before the normal completion check runs. Called once per tick with
// dtMs = real time elapsed since the previous tick.
function applyActionControls(now, dtMs) {
  Object.keys(actionState).forEach(key => {
    const st = actionState[key];
    const ctrl = actionControls[key];
    if (!ctrl) return;
    if (st.status === 'pending' && ctrl.paused) {
      // Shift the completion time forward by however much real time just
      // passed, so the remaining countdown stays exactly where it was —
      // same trick the overall session pause uses (total_paused_ms), just
      // applied live instead of via an accumulator.
      st.completesAt += dtMs;
      st.startedAt += dtMs;
    }
    const epoch = ctrl.skipEpoch || 0;
    if (epoch > (_processedSkipEpoch[key] || 0)) {
      _processedSkipEpoch[key] = epoch;
      if (st.status === 'pending' || st.status === 'queued') {
        const idx = actionQueue.indexOf(key);
        if (idx !== -1) actionQueue.splice(idx, 1);
        st.status = 'done';
        onActionComplete(key, now);
        tryStartQueued();
      }
    }
  });
}

function checkActionTimers(now) {
  Object.keys(actionState).forEach(key => {
    const st = actionState[key];
    if (st.status === 'pending' && now >= st.completesAt) {
      st.status = 'done';
      onActionComplete(key, now);
      tryStartQueued();
    }
  });
  // BP auto-refire: goes through the same 2-crew queue as everything else
  if (actionState.bp.status === 'done' && bpNextDueMs && now >= bpNextDueMs) {
    bpNextDueMs = null;
    actionState.bp.status = 'idle';
    startAction('bp');
  }
}

// Reports actionState to Supabase for sim_control.html's Actions tab. Only
// PATCHes when something actually changed, since this runs off the 1s tick
// and most ticks have no action-state change.
let _lastPushedActionsJSON = null;
function pushActionState() {
  if (!sessionCode) return;
  const summary = {};
  Object.keys(actionState).forEach(key => {
    const st = actionState[key];
    if (st.status === 'idle') return;
    summary[key] = {
      label: ACTION_LABELS[key] || key,
      status: st.status,
      startedAt: st.startedAt || null,
      completesAt: st.completesAt || null,
      paused: !!(actionControls[key] && actionControls[key].paused)
    };
  });
  const json = JSON.stringify(summary);
  if (json === _lastPushedActionsJSON) return;
  _lastPushedActionsJSON = json;
  sbPatch(`sim_sessions?session_code=eq.${encodeURIComponent(sessionCode)}`, { patient_actions: summary, updated_at: new Date().toISOString() }).catch(() => {});
}

function countdownRemain(st) {
  return Math.max(0, Math.ceil((st.completesAt - Date.now()) / 1000));
}

let bpNextDueMs = null;
let bpIntervalMin = 15;
let lastBP = { sys: null, dia: null };

// Simulated oscillometric cuff pressure while BP is 'pending': climbs to
// ~systolic+20, brief hold, then descends with a couple of realistic stutters.
function computeCuffPressure(st, now) {
  const total = st.completesAt - st.startedAt;
  const f = Math.min(1, Math.max(0, (now - st.startedAt) / Math.max(total, 1)));
  const target = (st.targetSys || 140) + 20;
  let val;
  if (f < 0.35) {
    val = 10 + (target - 10) * (f / 0.35);
  } else if (f < 0.45) {
    val = target;
  } else {
    const df = (f - 0.45) / 0.55;
    val = target * (1 - df);
    const w = 0.05;
    if (Math.abs(df - 0.25) < w) val += 6 * (1 - Math.abs(df - 0.25) / w);
    if (Math.abs(df - 0.6) < w) val -= 5 * (1 - Math.abs(df - 0.6) / w);
  }
  return Math.max(0, Math.round(val));
}

// --- ECG: rhythm from an AI/assessor-scripted event when there is one,
// otherwise derived from current HR (no name ever shown in either case) ---
let _ecgInst = null;
let _show12Lead = false;
let _currentRhythmKey = null;
let _lastHR = 90;

function deriveRhythmFromHR(hr) {
  if (hr < 60) return 'sinus bradycardia';
  if (hr > 100) return 'sinus tachycardia';
  return 'sinus rhythm';
}

function ensureECG(hr) {
  // HR alone can't distinguish arrest rhythms (asystole/VF/PEA all show "no
  // pulse" but look completely different) or any other scripted arrhythmia
  // — SimEngine.getRhythmAt returns whatever the assessor/AI explicitly put
  // on the monitor, if anything. Only fall back to the plain HR-derived
  // sinus bucket once nothing's been scripted yet.
  const explicitRhythm = SimEngine.getRhythmAt(testConfig, SimEngine.getSimNow(testConfig, Date.now()));
  const rhythmStr = explicitRhythm || deriveRhythmFromHR(hr);
  const mapped = ECGEngine.mapRhythm(rhythmStr, hr);
  if (!_ecgInst) {
    const container = document.getElementById('ecg-12lead-container');
    const wrap = document.getElementById('ecg-display-wrap');
    const availH = wrap.clientHeight;
    _ecgInst = new ECGEngine(container, { mode: '12lead', theme: 'monitor', height: availH });
    _ecgInst.setRhythm(mapped.key, mapped.bpm, mapped.bbbMode);
    _currentRhythmKey = mapped.key;
    setLeadDisplay();
    return;
  }
  if (mapped.key !== _currentRhythmKey) {
    // Rhythm reclassified (e.g. sinus -> tachycardia crosses a real engine key).
    // setRhythm() on the EXISTING instance does not clear the trace buffer —
    // it only resets beat-phase/morphology — so the waveform continues smoothly
    // instead of wiping and restarting like a full destroy/recreate would.
    _currentRhythmKey = mapped.key;
    _ecgInst.setRhythm(mapped.key, mapped.bpm, mapped.bbbMode);
  }
}

function rebuildECG(hr) {
  // Only for genuine geometry changes (window resize) — an actual destroy is
  // needed here since ECGEngine bakes container dimensions in at construction.
  if (_ecgInst) _ecgInst.destroy();
  _ecgInst = null;
  _currentRhythmKey = null;
  ensureECG(hr);
}

function setLeadDisplay() {
  if (!_ecgInst) return;
  const container = document.getElementById('ecg-12lead-container');
  const grid = container.querySelector('#_ecg_leadsGrid');
  if (grid) grid.style.display = _show12Lead ? 'grid' : 'none';
}

function toggleLead() {
  _show12Lead = !_show12Lead;
  setLeadDisplay();
  updateEcgBar();
}

// --- Limb-lead cycling for monitoring-only mode (before 12-lead applied) --
// Uses ecg_engine.js's setStripLead(name) — a real API added for this feature,
// rendering the chosen lead at the same full-width/crisp resolution Lead II
// always used, rather than reusing the small 12-lead-grid cells.
const limbLeadOrder = ['I', 'II', 'III', 'aVR', 'aVL', 'aVF'];
let _limbLeadIndex = 1; // start on 'II'

function cycleLimbLead() {
  if (actionState.ecg.status !== 'done' || actionState.ecg12lead.status === 'done') return;
  _limbLeadIndex = (_limbLeadIndex + 1) % limbLeadOrder.length;
  if (_ecgInst) _ecgInst.setStripLead(limbLeadOrder[_limbLeadIndex]);
}

function ecgBarBtnClick() {
  const ecg12St = actionState.ecg12lead;
  if (ecg12St.status === 'done') { toggleLead(); return; }
  if (ecg12St.status === 'idle') { startAction('ecg12lead'); }
}

function updateEcgBar() {
  const btn = document.getElementById('leadToggleBtn');
  const label = document.getElementById('ecg-bar-label');
  const ecg12St = actionState.ecg12lead;
  const ecgDone = actionState.ecg.status === 'done';
  if (ecg12St.status === 'done') {
    btn.textContent = _show12Lead ? 'Show Lead II' : 'Show 12-Lead';
    btn.disabled = false;
    label.textContent = _show12Lead ? '12-LEAD ECG' : 'LEAD II \u2014 RHYTHM STRIP';
  } else {
    if (ecg12St.status === 'pending') {
      btn.textContent = `Applying\u2026 ${countdownRemain(ecg12St)}s`;
      btn.disabled = true;
    } else if (ecg12St.status === 'queued') {
      btn.textContent = 'Queued\u2026';
      btn.disabled = true;
    } else {
      btn.textContent = 'Apply 12-Lead ECG';
      btn.disabled = false;
    }
    // While monitoring ECG isn't done, show not-applied state. Once it IS done,
    // showLimbLead() owns the label (cycling hint) — leave it alone here.
    if (!ecgDone) label.textContent = 'ECG NOT APPLIED';
  }
}

function updateEcgMain(hr) {
  const overlay = document.getElementById('ecg-apply-overlay');
  const banner = document.getElementById('ecg-progress-banner');
  const ecgSt = actionState.ecg;
  const ecg12St = actionState.ecg12lead;

  if (ecgSt.status === 'done') {
    // Lead II (or a cycled limb lead) is already visible — never cover it.
    // A pending/queued 12-lead only gets a thin non-blocking banner.
    overlay.style.display = 'none';
    ensureECG(hr);
    setLeadDisplay(); // plain Lead II strip when ecg12 not done, grid when it is
    if (ecg12St.status !== 'done' && _ecgInst) {
      // Re-apply the cycled lead selection each tick — a no-op if unchanged,
      // but necessary because ensureECG() may have rebuilt the instance
      // (rhythm change), which resets its internal selection back to 'II'.
      _ecgInst.setStripLead(limbLeadOrder[_limbLeadIndex]);
    }
    if (ecg12St.status === 'done') {
      banner.style.display = 'none';
    } else {
      if (ecg12St.status === 'pending') {
        banner.style.display = 'block';
        banner.textContent = `Applying 12-Lead ECG\u2026 ${countdownRemain(ecg12St)}s`;
      } else if (ecg12St.status === 'queued') {
        banner.style.display = 'block';
        banner.textContent = '12-Lead ECG queued\u2026 crew busy';
      } else {
        banner.style.display = 'none';
      }
    }
  } else {
    banner.style.display = 'none';
    overlay.style.display = 'flex';
    if (ecgSt.status === 'pending') {
      overlay.innerHTML = `<div class="ecg-overlay-text">Applying ECG (Monitoring Leads)\u2026 ${countdownRemain(ecgSt)}s</div>`;
    } else if (ecgSt.status === 'queued') {
      overlay.innerHTML = `<div class="ecg-overlay-text">ECG queued\u2026 crew busy</div>`;
    } else if (ecg12St.status === 'pending') {
      overlay.innerHTML = `<div class="ecg-overlay-text">Applying 12-Lead ECG\u2026 ${countdownRemain(ecg12St)}s</div>`;
    } else if (ecg12St.status === 'queued') {
      overlay.innerHTML = `<div class="ecg-overlay-text">12-Lead ECG queued\u2026 crew busy</div>`;
    } else {
      overlay.innerHTML = `<button class="apply-btn-lg" onclick="startAction('ecg')">Apply ECG (Monitoring Leads)</button>`;
    }
  }
  updateEcgBar();
}

function fmtTimer(ms) {
  const s = Math.floor(ms / 1000);
  const mm = String(Math.floor(s / 60)).padStart(2, '0');
  const ss = String(s % 60).padStart(2, '0');
  return `${mm}:${ss}`;
}

function cellFor(actionKey) {
  const st = actionState[actionKey];
  if (st.status === 'idle') return `<span class="tap-hint">Tap to Apply</span>`;
  if (st.status === 'queued') return `<span class="queued-txt">Queued\u2026</span>`;
  return `<span class="pending-txt">${countdownRemain(st)}s</span>`;
}

// Whole-tile tap handlers — the entire box is the touch target (iPad-friendly),
// not a small inner button. Idle -> start; done (BP/one-offs only) -> retake.
function handleVitalTap(actionKey) {
  const st = actionState[actionKey];
  if (st.status === 'idle') startAction(actionKey);
  // pending/queued -> already in progress, ignore taps
  // done (continuous vitals) -> already live, nothing to retake
}
function handleBPTap() {
  const st = actionState.bp;
  if (st.status === 'idle') { startAction('bp'); return; }
  if (st.status === 'done') { st.status = 'idle'; startAction('bp'); return; }
}
function handleOneOffTap(key) {
  const st = actionState[key];
  if (st.status === 'idle') startAction(key);
  else if (st.status === 'done') reassess(key);
}

function renderBPCell(now) {
  const st = actionState.bp;
  if (st.status === 'idle') return `<span class="tap-hint">Tap to Take BP</span>`;
  if (st.status === 'queued') return `<span class="queued-txt">Queued\u2026</span>`;
  if (st.status === 'pending') {
    const p = computeCuffPressure(st, now);
    return `${p}<span class="vunit">mmHg</span><div id="bp-timer">cuff inflating\u2026</div>`;
  }
  const remainMs = Math.max(0, (bpNextDueMs || now) - now);
  return `${lastBP.sys}/${lastBP.dia}<span class="vunit">mmHg</span><div id="bp-timer">next auto BP in ${fmtTimer(remainMs)} \u2022 tap to retake</div>`;
}

function renderMonitor(v, now) {
  const box = document.getElementById('monitor-box');
  const ecgDone = actionState.ecg.status === 'done';
  const hrCell = ecgDone ? `${v.HR}<span class="vunit">bpm</span>` : cellFor('ecg');
  const rrCell = actionState.rr.status === 'done' ? `${v.RR}<span class="vunit">/min</span>` : cellFor('rr');
  const spo2Cell = actionState.spo2.status === 'done' ? `${v.SpO2}<span class="vunit">%</span>` : cellFor('spo2');
  const etco2Cell = actionState.etco2.status === 'done' ? `${v.EtCO2}<span class="vunit">mmHg</span>` : cellFor('etco2');
  const bpCell = renderBPCell(now);

  box.innerHTML = `
    <div class="vblock v-hr" onclick="handleVitalTap('ecg')"><div class="vlabel">HR</div><div class="vvalue">${hrCell}</div></div>
    <div class="vblock v-bp" onclick="handleBPTap()"><div class="vlabel">NIBP</div><div class="vvalue">${bpCell}</div></div>
    <div class="vblock v-spo2" onclick="handleVitalTap('spo2')"><div class="vlabel">SpO\u2082</div><div class="vvalue">${spo2Cell}</div></div>
    <div class="vblock v-rr" onclick="handleVitalTap('rr')"><div class="vlabel">Resp</div><div class="vvalue">${rrCell}</div></div>
    <div class="vblock v-etco2" onclick="handleVitalTap('etco2')"><div class="vlabel">EtCO\u2082</div><div class="vvalue">${etco2Cell}</div></div>
  `;
}


function renderOneOff() {
  const strip = document.getElementById('oneoff-strip');
  strip.innerHTML = Object.entries(oneOffDefs).map(([key, def]) => {
    const st = actionState[key];
    let body;
    if (st.status === 'idle') {
      body = `<div class="tap-hint">Tap to Assess</div>`;
    } else if (st.status === 'queued') {
      body = `<div class="oo-queued">Queued\u2026</div>`;
    } else if (st.status === 'pending') {
      body = `<div class="oo-pending">${countdownRemain(st)}s\u2026</div>`;
    } else {
      body = `<div class="oo-value">${formatStaticVital(key, st.value)}${def.unit ? `<span style="font-size:9px"> ${def.unit}</span>` : ''}</div><div class="oo-tap-again">tap to reassess</div>`;
    }
    return `<div class="oo-card" onclick="handleOneOffTap('${key}')"><div class="oo-label">${def.label}</div>${body}</div>`;
  }).join('');
}

let _lastTickMs = Date.now();
function tick() {
  if (!testConfig) return;
  const now = Date.now();
  const dtMs = now - _lastTickMs;
  _lastTickMs = now;
  const simNow = SimEngine.getSimNow(testConfig, now);
  applyActionControls(now, dtMs); // assessor pause/skip on individual student actions
  checkActionTimers(now); // local action-delay timers stay real-time — a scenario
                           // pause freezes the patient's physiology, not the
                           // real-world time it takes a crew member to do something

  const v = SimEngine.getVitals(testConfig, simNow);
  renderMonitor(v, now);
  updateEcgMain(v.HR);
  renderOneOff();
  updateAvatarFace(extendedVitalsNow());
  _lastHR = v.HR;
  document.getElementById('scenario-timer').textContent = fmtTimer(simNow - testConfig.startTimeMs);
  const indEl = document.getElementById('instant-mode-indicator');
  indEl.style.display = instantMode ? 'inline' : 'none';
  const pauseEl = document.getElementById('pause-indicator');
  pauseEl.style.display = testConfig.isPaused ? 'inline' : 'none';
  pushActionState();
}

window.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  if (code && /^\d{6}$/.test(code)) {
    document.getElementById('gate-code-input').value = code;
    connectSession(code);
  }
});

window.addEventListener('resize', () => {
  if (actionState.ecg.status === 'done') rebuildECG(_lastHR);
});

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { tick(); pollSession(); }
});

// --- Voice capture: "Give Treatment" / "Talk to Patient" ------------------
// Chrome-only (webkitSpeechRecognition — iOS Safari has no speech
// recognition API at all). This device has no scenario context or
// Anthropic key, so recognised text is just queued onto the session row;
// sim_control.html (already polling, already holding that context) picks
// it up and actions it identically to typing into its own Drug/Action box
// — see processStudentQueue()/giveTreatment() there. Chat questions get an
// AI-generated in-character reply written back to patient_reply, which
// this page picks up via the existing pollSession() poll and speaks aloud.
let _voiceMode = null;
let _recognition = null;
let _voiceFinalText = '';
let _lastChatSentId = null;
let _lastChatSentMode = null;
let _lastShownReplyId = null;
let _speechUnlocked = false;
let _cachedVoices = [];
let patientGender = null; // 'male' | 'female' | null — set from the scenario title once known, see connectSession()
let _voiceModalOpen = false; // tracks whether the modal is open, so the auto-relisten loop (chat mode) knows to stop once the student closes it

function getSpeechRecognitionCtor() {
  return window.SpeechRecognition || window.webkitSpeechRecognition || null;
}

// Fires the browser's mic-permission prompt right after joining the
// session, instead of waiting for the first Give Treatment/Assessment/Talk
// to Patient tap — so by the time the crew actually needs it, it's already
// granted rather than costing a few seconds (and a jarring popup) mid-flow.
// getUserMedia is the standard way to request "microphone" permission on
// its own; SpeechRecognition.start() shares that same permission grant, so
// this is enough to cover all three voice buttons. We only want the
// permission, not an active mic, so the track is stopped immediately.
async function requestMicPermissionEarly() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach(t => t.stop());
  } catch (e) { /* declined or unavailable — voice buttons will just prompt again (or show unavailable) when tapped */ }
}

// Chrome's speech-synthesis voice list loads asynchronously (empty on first
// call), and on some Chrome builds speak() silently produces no audio the
// very first time it's called without a direct user-gesture in the call
// stack — exactly our case, since the real reply is spoken later from a
// poll callback, not a click handler. Fix: prime both (load voices, and
// fire one near-silent utterance) synchronously inside the button tap
// itself (openVoiceModal is a genuine user gesture), once per page load.
function refreshVoiceCache() {
  if ('speechSynthesis' in window) _cachedVoices = window.speechSynthesis.getVoices();
}
if ('speechSynthesis' in window) {
  refreshVoiceCache();
  window.speechSynthesis.onvoiceschanged = refreshVoiceCache;
}
function unlockSpeechSynthesis() {
  if (_speechUnlocked || !('speechSynthesis' in window)) return;
  _speechUnlocked = true;
  try {
    window.speechSynthesis.cancel();
    const primer = new SpeechSynthesisUtterance(' ');
    primer.volume = 0;
    window.speechSynthesis.speak(primer);
  } catch (e) { /* best-effort unlock only */ }
}

// Voice name substrings the Web Speech API doesn't expose a real "gender"
// attribute for, so this is a heuristic over voice.name (which varies by
// OS/browser — e.g. "Google UK English Male", "Microsoft David", "Samantha").
// Explicit "male"/"female" in the name wins; falls back to known common
// voice names; falls back further to just any en-AU/en-* voice, same as
// before this existed.
const MALE_VOICE_HINTS = ['male', 'david', 'daniel', 'alex', 'fred', 'guy', 'ryan', 'mark', 'thomas', 'james', 'george', 'oliver', 'aaron'];
const FEMALE_VOICE_HINTS = ['female', 'samantha', 'victoria', 'karen', 'susan', 'zira', 'emma', 'amy', 'joanna', 'salli', 'kate', 'moira', 'tessa'];

function pickVoice() {
  if (!_cachedVoices.length) refreshVoiceCache();
  const enVoices = _cachedVoices.filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
  const pool = enVoices.length ? enVoices : _cachedVoices;
  if (patientGender === 'male' || patientGender === 'female') {
    const wantFemale = patientGender === 'female';
    const explicit = pool.find(v => wantFemale ? /female/i.test(v.name) : (/\bmale\b/i.test(v.name) && !/female/i.test(v.name)));
    if (explicit) return explicit;
    const hints = wantFemale ? FEMALE_VOICE_HINTS : MALE_VOICE_HINTS;
    const hinted = pool.find(v => hints.some(h => v.name.toLowerCase().includes(h)));
    if (hinted) return hinted;
  }
  return pool.find(v => v.lang === 'en-AU') || pool[0] || null;
}

async function queueStudentItem(type, text) {
  const rows = await sbGet(`sim_sessions?session_code=eq.${encodeURIComponent(sessionCode)}&select=student_queue`);
  const queue = (rows[0] && rows[0].student_queue) || [];
  const id = Date.now();
  queue.push({ id, type, text });
  await sbPatch(`sim_sessions?session_code=eq.${encodeURIComponent(sessionCode)}`, { student_queue: queue, updated_at: new Date().toISOString() });
  return id;
}

const VOICE_MODE_LABELS = { treatment: 'Give Treatment', exam: 'Assessment', chat: 'Talk to Patient' };
const VOICE_MODE_REPLY_LABELS = { exam: 'Finding:', chat: 'Patient replied:' };

function openVoiceModal(mode) {
  unlockSpeechSynthesis(); // must happen here, inside the tap handler, to count as a user gesture
  _voiceMode = mode;
  document.getElementById('voice-modal-title').textContent = VOICE_MODE_LABELS[mode] || mode;
  document.getElementById('voice-modal-transcript').textContent = '';
  document.getElementById('patient-reply-display').style.display = 'none';
  document.getElementById('patient-reply-display').textContent = '';
  document.getElementById('patient-info-normal').style.display = 'none';
  document.getElementById('patient-info-voice').style.display = 'flex';
  _voiceModalOpen = true;
  syncInputModeUI();
  beginCapture();
}

// Speech vs typed toggle — persists across button opens (a device/session
// preference more than a per-question choice) rather than resetting each
// time. Defaults to speech.
let _inputMode = 'speech'; // 'speech' | 'type'

function syncInputModeUI() {
  document.getElementById('mode-pill-speech').classList.toggle('active', _inputMode === 'speech');
  document.getElementById('mode-pill-type').classList.toggle('active', _inputMode === 'type');
  document.getElementById('type-input-row').style.display = _inputMode === 'type' ? 'flex' : 'none';
  document.getElementById('voice-modal-transcript').style.display = _inputMode === 'type' ? 'none' : 'block';
}

function setInputMode(mode) {
  if (_inputMode === mode) return;
  _inputMode = mode;
  if (_recognition) { try { _recognition.abort(); } catch (e) {} }
  document.getElementById('voice-mic-indicator').classList.remove('listening');
  syncInputModeUI();
  if (_voiceModalOpen) beginCapture();
}

// Single entry point for "start waiting on the next question/answer" —
// starts the mic in speech mode, or just clears/focuses the text field in
// typed mode. Used on open, on Try Again, and by the Talk to Patient
// continuous-conversation loop once a reply is done.
function beginCapture() {
  document.getElementById('patient-reply-display').style.display = 'none';
  if (_inputMode === 'type') {
    document.getElementById('voice-modal-status').textContent = 'Type your message below.';
    document.getElementById('voice-modal-transcript').textContent = '';
    const inputEl = document.getElementById('type-input');
    inputEl.value = '';
    setTimeout(() => inputEl.focus(), 50);
  } else {
    startVoiceCapture();
  }
}

// Auto-starts listening as soon as it's called, and auto-sends as soon as
// recognition stops (Chrome's continuous=false auto-stops after a pause in
// speech) — no manual Send tap needed in speech mode. onend always fires
// after either a natural pause or an explicit stop/abort, so it's the
// single place that triggers the send.
function startVoiceCapture() {
  const Ctor = getSpeechRecognitionCtor();
  const statusEl = document.getElementById('voice-modal-status');
  const transcriptEl = document.getElementById('voice-modal-transcript');
  const micEl = document.getElementById('voice-mic-indicator');
  _voiceFinalText = '';
  transcriptEl.textContent = '';
  if (!Ctor) {
    statusEl.textContent = 'Speech recognition isn\u2019t available in this browser \u2014 use Chrome, or switch to Type.';
    return;
  }
  if (_recognition) { try { _recognition.abort(); } catch (e) {} }
  _recognition = new Ctor();
  _recognition.lang = 'en-AU';
  _recognition.continuous = false;
  _recognition.interimResults = true;
  _recognition.maxAlternatives = 1;
  statusEl.textContent = 'Listening\u2026';
  micEl.classList.add('listening');
  _recognition.onresult = (ev) => {
    let interim = '', final = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const t = ev.results[i][0].transcript;
      if (ev.results[i].isFinal) final += t; else interim += t;
    }
    if (final) _voiceFinalText = (_voiceFinalText + ' ' + final).trim();
    transcriptEl.textContent = (_voiceFinalText + ' ' + interim).trim();
  };
  _recognition.onerror = (ev) => {
    micEl.classList.remove('listening');
    statusEl.textContent = ev.error === 'no-speech' ? 'Didn\u2019t catch anything \u2014 tap Try Again.' : `Speech recognition error: ${ev.error}`;
  };
  _recognition.onend = () => {
    micEl.classList.remove('listening');
    if (_voiceFinalText) {
      sendCapturedText(_voiceFinalText);
    } else {
      statusEl.textContent = 'Didn\u2019t catch anything \u2014 tap Try Again.';
    }
  };
  try { _recognition.start(); } catch (e) { micEl.classList.remove('listening'); statusEl.textContent = 'Could not start the microphone.'; }
}

function restartVoiceCapture() {
  beginCapture();
}

function closeVoiceModal() {
  _voiceModalOpen = false;
  document.getElementById('voice-mic-indicator').classList.remove('listening');
  if (_recognition) { try { _recognition.abort(); } catch (e) {} _recognition = null; }
  if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (e) {} }
  document.getElementById('patient-info-voice').style.display = 'none';
  document.getElementById('patient-info-normal').style.display = 'block';
}

// Shared by both input modes — speech's onend handler and Type's Send
// button/Enter key both funnel through here.
async function sendCapturedText(text) {
  text = (text || '').trim();
  if (!text || !sessionCode) return;
  const statusEl = document.getElementById('voice-modal-status');
  statusEl.textContent = 'Sending\u2026';
  try {
    const id = await queueStudentItem(_voiceMode, text);
    if (_voiceMode === 'treatment') {
      statusEl.textContent = 'Sent.';
      setTimeout(closeVoiceModal, 900);
    } else {
      _lastChatSentId = id;
      _lastChatSentMode = _voiceMode;
      statusEl.textContent = _voiceMode === 'exam' ? 'Waiting for the finding\u2026' : 'Waiting for the patient to reply\u2026';
    }
  } catch (e) {
    statusEl.textContent = 'Could not send \u2014 check the connection and try again.';
  }
}

async function sendTypedText() {
  const inputEl = document.getElementById('type-input');
  const text = inputEl.value;
  inputEl.value = '';
  await sendCapturedText(text);
}

// Called from pollSession() every ~3s — matches the reply against the last
// chat/exam question THIS device sent (forId), and against the last reply
// already shown (reply.id) so it doesn't re-speak on every poll.
function checkForPatientReply(reply) {
  if (!reply || !_lastChatSentId) return;
  if (reply.forId !== _lastChatSentId) return;
  if (reply.id === _lastShownReplyId) return;
  _lastShownReplyId = reply.id;
  const mode = _lastChatSentMode;
  const isExam = mode === 'exam';
  const isConversation = mode === 'chat'; // only "Talk to Patient" auto-relistens once the reply finishes
  const replyEl = document.getElementById('patient-reply-display');
  replyEl.textContent = isExam ? reply.text : `\u201C${reply.text}\u201D`;
  replyEl.style.display = 'block';
  document.getElementById('voice-modal-status').textContent = VOICE_MODE_REPLY_LABELS[mode] || 'Reply:';
  _lastChatSentId = null;

  // Resumes listening once the reply is done — the continuous-conversation
  // loop for "Talk to Patient". Guarded by _voiceModalOpen so a reply that
  // arrives after the student has already closed the modal doesn't restart
  // the mic in the background; the student stops the loop simply by tapping
  // Cancel (closeVoiceModal sets that flag false and also stops any
  // in-progress speech).
  const resumeIfConversing = () => {
    if (isConversation && _voiceModalOpen) beginCapture();
  };

  if (reply.speak !== false && 'speechSynthesis' in window) {
    try {
      window.speechSynthesis.cancel(); // clear anything stuck in the queue (e.g. the priming utterance) first
      const utter = new SpeechSynthesisUtterance(reply.text);
      const voice = pickVoice();
      if (voice) utter.voice = voice;
      utter.lang = 'en-AU';
      utter.onstart = startTalkAnimation;
      utter.onend = () => { stopTalkAnimation(); resumeIfConversing(); };
      utter.onerror = () => { stopTalkAnimation(); resumeIfConversing(); };
      window.speechSynthesis.speak(utter);
    } catch (e) {
      // TTS best-effort only — the text is already shown on screen. Still
      // resume the loop after a short pause so a conversation doesn't stall.
      if (isConversation) setTimeout(resumeIfConversing, 1200);
    }
  } else if (isConversation) {
    // No speech at all (e.g. GCS-gated "no verbal response") — pause briefly
    // so the text is readable, then resume listening for the next question.
    setTimeout(resumeIfConversing, 1500);
  }
}
</script>
