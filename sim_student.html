<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Live Scenario — Student View</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: linear-gradient(135deg, #2C4F7C 0%, #4E7FAE 55%, #6FA0CC 100%); color: #1e2a36; font-family: 'Courier New', monospace; }
body { display: flex; flex-direction: column; min-height: 100vh; }
#topbar { background: #ffffff; border-bottom: 2px solid #d7dee6; padding: 8px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
#topbar .title { font-size: 12px; font-weight: 900; letter-spacing: 1px; color: #0369a1; text-transform: uppercase; }
#topbar-right { display: flex; align-items: center; gap: 14px; }
#instant-mode-label { font-size: 10px; display: flex; align-items: center; gap: 4px; color: #33475a; cursor: pointer; user-select: none; }
#scenario-timer { font-size: 13px; font-weight: 700; color: #15803d; }
#main { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 10px; }
@media (min-width: 800px) { #main { flex-direction: row; } }
.panel { background: #ffffff; border: 1px solid #d7dee6; border-radius: 8px; padding: 10px; }
#monitor-col { background: #0a0e16 !important; border-color: #142235 !important; }
#info-col { flex: 1; max-width: 280px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
#patient-info h2 { font-size: 12px; color: #0369a1; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
#patient-info .row { font-size: 12px; color: #33475a; margin-bottom: 3px; }
#patient-graphic { flex: 1; min-height: 140px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
#patient-graphic img { max-width: 100%; max-height: 100%; object-fit: contain; }

/* Monitor main row (ECG + narrow vitals sidebar side-by-side, matching monitor.html) */
#monitor-main { display: flex; flex-direction: row; flex: 1; min-height: 0; overflow: hidden; border-bottom: 2px solid #0d1f35; }
#ecg-section { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #060606; overflow: hidden; border-right: 2px solid #0d1f35; }
.ecg-section-bar { display: flex; align-items: center; justify-content: space-between; padding: 6px 12px; background: #060910; border-bottom: 1px solid #0d1f35; font-size: 10px; letter-spacing: 1.5px; color: #00ff88; text-transform: uppercase; flex-shrink: 0; }
.ecg-snapshot-btn { background: rgba(0,255,136,0.08); border: 2px solid #00ff88; color: #00ff88; font-family: 'Courier New', monospace; font-size: 11px; font-weight: bold; letter-spacing: 1px; padding: 4px 12px; cursor: pointer; text-transform: uppercase; border-radius: 4px; }
.ecg-snapshot-btn:disabled { opacity: 0.5; cursor: default; }
#ecg-display-wrap { position: relative; flex: 1; min-height: 0; overflow: hidden; }
#ecg-12lead-container { width: 100%; height: 100%; overflow: hidden; cursor: pointer; }
#ecg-apply-overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(6,9,16,0.94); text-align: center; padding: 10px; z-index: 5; }
.ecg-overlay-text { color: #00ff88; font-size: 12px; letter-spacing: 1px; }
.apply-btn-lg { background: rgba(0,255,136,0.1); border: 2px solid #00ff88; color: #00ff88; font-family: 'Courier New', monospace; font-size: 12px; font-weight: bold; padding: 10px 18px; border-radius: 6px; cursor: pointer; letter-spacing: 1px; }
#ecg-progress-banner { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.75); color: #00ff88; font-size: 10px; text-align: center; padding: 3px 6px; letter-spacing: 1px; display: none; z-index: 6; pointer-events: none; }

/* Vitals sidebar — narrow column beside the ECG, each block flex:1 (matches monitor.html #vitals-panel) */
#monitor-box { width: 150px; flex-shrink: 0; display: flex; flex-direction: column; background: #080c14; overflow: hidden; }
.vblock { flex: 1; min-height: 0; display: flex; flex-direction: column; border-bottom: 2px solid #0d1f35; padding: 3px 8px; overflow: hidden; }
.vlabel { font-size: 8px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; flex-shrink: 0; }
.vvalue { flex: 1; display: flex; align-items: center; font-size: clamp(14px, 2.2vw, 22px); font-weight: 900; line-height: 1; font-family: 'Courier New', monospace; min-height: 0; overflow: hidden; }
.vunit { font-size: 8px; font-weight: 400; opacity: 0.7; margin-left: 3px; align-self: flex-end; }
.v-hr   .vlabel { color: #ffffff; } .v-hr   .vvalue { color: #ffffff; }
.v-bp   .vlabel { color: #7fff00; } .v-bp   .vvalue { color: #7fff00; }
.v-spo2 .vlabel { color: #4fc3f7; } .v-spo2 .vvalue { color: #4fc3f7; }
.v-rr   .vlabel { color: #ffd54f; } .v-rr   .vvalue { color: #ffd54f; }
.v-etco2 .vlabel { color: #ff8a65; } .v-etco2 .vvalue { color: #ff8a65; }
#bp-timer { font-size: 7px; color: #4a6a8a; }
.apply-btn { font-size: 8px; background: none; border: 1px solid currentColor; border-radius: 3px; padding: 2px 5px; cursor: pointer; color: inherit; font-family: inherit; }
.pending-txt { font-size: 10px; opacity: 0.85; }
.queued-txt { font-size: 9px; opacity: 0.7; font-style: italic; }

#oneoff-strip { display: flex; flex-wrap: wrap; gap: 0; border-top: 2px solid #0d1f35; }
.oo-card { flex: 1; min-width: 90px; padding: 6px 8px; border-right: 1px solid #1a2a3a; border-bottom: 1px solid #1a2a3a; }
.oo-label { font-size: 8px; font-weight: 700; color: #4a6a8a; text-transform: uppercase; letter-spacing: 1px; }
.oo-value { font-size: 15px; font-weight: 700; color: #c0d4e8; }
.oo-btn { font-size: 9px; color: #4fc3f7; background: none; border: 1px solid #1a3a5a; border-radius: 3px; padding: 1px 5px; cursor: pointer; margin-top: 2px; }
.oo-pending { font-size: 10px; color: #4fc3f7; margin-top: 2px; }
.oo-queued { font-size: 9px; color: #6b8299; margin-top: 2px; font-style: italic; }
</style>
</head>
<body>
<div id="topbar">
  <div class="title">Live Scenario — Student View</div>
  <div id="topbar-right">
    <label id="instant-mode-label"><input type="checkbox" id="instantModeToggle" onchange="toggleInstantMode()"> Instant Mode</label>
    <div id="scenario-timer">00:00</div>
  </div>
</div>
<div class="panel" id="patient-info" style="margin:10px 10px 0;">
  <h2>Patient / Scene Info</h2>
  <div class="row" id="pi-demographics">45yo Male</div>
  <div class="row" id="pi-dispatch">Dispatch: Chest pain, 2 hrs onset</div>
  <div class="row" id="pi-complaint">C/O: Central chest pain radiating to left arm, diaphoretic</div>
</div>
<div id="main">
  <div id="monitor-col" class="panel" style="flex:2;min-width:0;padding:0;overflow:hidden;display:flex;flex-direction:column;">
    <div id="monitor-main">
      <div id="ecg-section">
        <div class="ecg-section-bar">
          <span id="ecg-bar-label">ECG NOT APPLIED</span>
          <button class="ecg-snapshot-btn" onclick="ecgBarBtnClick()" id="leadToggleBtn">Apply 12-Lead ECG</button>
        </div>
        <div id="ecg-display-wrap">
          <div id="ecg-12lead-container" onclick="cycleLimbLead()"></div>
          <div id="ecg-apply-overlay"></div>
          <div id="ecg-progress-banner"></div>
        </div>
      </div>
      <div id="monitor-box"></div>
    </div>
    <div id="oneoff-strip"></div>
  </div>
  <div id="info-col">
    <div class="panel" id="patient-graphic"><img src="https://1984tpearson.github.io/AV/Body_map.jpg" alt="Patient body map"></div>
  </div>
</div>

<script src="https://1984tpearson.github.io/AV/ecg_engine.js"></script>
<script src="https://1984tpearson.github.io/AV/sim_engine.js"></script>
<script>
// --- STATIC TEST TRAJECTORY (proof-of-render only; no session sync yet) ---
const testConfig = {
  baseline: { HR: 92, RR: 20, SpO2: 96, EtCO2: 38, BPsys: 148, BPdia: 90 },
  severity: 'moderate',
  direction: 'deteriorating',
  startTimeMs: Date.now(),
  treatments: [],
  instantMode: false
};

let instantMode = false;
function toggleInstantMode() {
  instantMode = document.getElementById('instantModeToggle').checked;
  testConfig.instantMode = instantMode; // also collapses the deterioration ramp
}

// --- Action delay/reveal system, with a 2-crew concurrency limit ---------
// Status lifecycle: idle -> (queued ->) pending -> done
// Only MAX_CONCURRENT actions may be 'pending' (a crew member actively doing
// it) at once; further requests wait as 'queued' until a slot frees up.
const MAX_CONCURRENT = 2;
let actionQueue = [];
const actionState = {};
['ecg','ecg12lead','spo2','etco2','bp','temp','gcs','bgl','ketones','pain'].forEach(k => {
  actionState[k] = { status: 'idle' };
});

const oneOffDefs = {
  temp:    { label: 'Temp',    unit: '\u00b0C',    getValue: () => (36.5 + (Math.random()*0.6-0.3)).toFixed(1) },
  gcs:     { label: 'GCS',     unit: '',            getValue: () => '15/15' },
  bgl:     { label: 'BGL',     unit: 'mmol/L',      getValue: () => (6.0 + (Math.random()*0.6-0.3)).toFixed(1) },
  ketones: { label: 'Ketones', unit: 'mmol/L',      getValue: () => (0.1).toFixed(1) },
  pain:    { label: 'Pain',    unit: '',             getValue: () => '8/10' }
};

function countPending() {
  return Object.values(actionState).filter(s => s.status === 'pending').length;
}

function tryStartQueued() {
  while (countPending() < MAX_CONCURRENT && actionQueue.length > 0) {
    const key = actionQueue.shift();
    if (actionState[key] && actionState[key].status === 'queued') beginPending(key);
  }
}

function startAction(key) {
  const st = actionState[key];
  if (!st || st.status !== 'idle') return;
  if (countPending() < MAX_CONCURRENT) {
    beginPending(key);
  } else {
    st.status = 'queued';
    actionQueue.push(key);
  }
}

function beginPending(key) {
  const st = actionState[key];
  const now = Date.now();
  const context = { ecgApplied: actionState.ecg.status === 'done' };
  const durSec = SimEngine.getActionDurationSec(key, context);
  const durMs = instantMode ? 0 : durSec * 1000;
  if (key === 'bp') {
    const v = SimEngine.getVitals(testConfig, now);
    st.targetSys = v.BPsys;
  }
  if (durMs <= 0) {
    st.status = 'done';
    onActionComplete(key, now);
    tryStartQueued();
  } else {
    st.status = 'pending';
    st.startedAt = now;
    st.completesAt = now + durMs;
  }
}

function onActionComplete(key, now) {
  if (key === 'ecg12lead') {
    if (actionState.ecg.status !== 'done') actionState.ecg.status = 'done';
    _show12Lead = true;
    resetGridInlineStyles(); // hand back to the engine's normal grid/toggle view
  }
  if (key === 'bp') {
    const v = SimEngine.getVitals(testConfig, now);
    lastBP = { sys: v.BPsys, dia: v.BPdia };
    bpNextDueMs = now + bpIntervalMin * 60000;
  }
  if (oneOffDefs[key]) {
    actionState[key].value = oneOffDefs[key].getValue();
  }
}

function reassess(key) {
  actionState[key].status = 'idle';
  startAction(key);
}

function checkActionTimers(now) {
  Object.keys(actionState).forEach(key => {
    const st = actionState[key];
    if (st.status === 'pending' && now >= st.completesAt) {
      st.status = 'done';
      onActionComplete(key, now);
      tryStartQueued();
    }
  });
  // BP auto-refire: goes through the same 2-crew queue as everything else
  if (actionState.bp.status === 'done' && bpNextDueMs && now >= bpNextDueMs) {
    bpNextDueMs = null;
    actionState.bp.status = 'idle';
    startAction('bp');
  }
}

function countdownRemain(st) {
  return Math.max(0, Math.ceil((st.completesAt - Date.now()) / 1000));
}

let bpNextDueMs = null;
let bpIntervalMin = 15;
let lastBP = { sys: null, dia: null };

// Simulated oscillometric cuff pressure while BP is 'pending': climbs to
// ~systolic+20, brief hold, then descends with a couple of realistic stutters.
function computeCuffPressure(st, now) {
  const total = st.completesAt - st.startedAt;
  const f = Math.min(1, Math.max(0, (now - st.startedAt) / Math.max(total, 1)));
  const target = (st.targetSys || 140) + 20;
  let val;
  if (f < 0.35) {
    val = 10 + (target - 10) * (f / 0.35);
  } else if (f < 0.45) {
    val = target;
  } else {
    const df = (f - 0.45) / 0.55;
    val = target * (1 - df);
    const w = 0.05;
    if (Math.abs(df - 0.25) < w) val += 6 * (1 - Math.abs(df - 0.25) / w);
    if (Math.abs(df - 0.6) < w) val -= 5 * (1 - Math.abs(df - 0.6) / w);
  }
  return Math.max(0, Math.round(val));
}

// --- ECG: dynamic rhythm derived from current HR (no name ever shown) ---
let _ecgInst = null;
let _show12Lead = false;
let _currentRhythmKey = null;
let _lastHR = 90;

function deriveRhythmFromHR(hr) {
  if (hr < 60) return 'sinus bradycardia';
  if (hr > 100) return 'sinus tachycardia';
  return 'sinus rhythm';
}

function ensureECG(hr) {
  const rhythmStr = deriveRhythmFromHR(hr);
  const mapped = ECGEngine.mapRhythm(rhythmStr, hr);
  if (mapped.key === _currentRhythmKey && _ecgInst) return;
  _currentRhythmKey = mapped.key;
  const container = document.getElementById('ecg-12lead-container');
  const wrap = document.getElementById('ecg-display-wrap');
  const availH = wrap.clientHeight;
  if (_ecgInst) _ecgInst.destroy();
  _ecgInst = new ECGEngine(container, { mode: '12lead', theme: 'monitor', height: availH });
  _ecgInst.setRhythm(mapped.key, mapped.bpm, mapped.bbbMode);
  setLeadDisplay();
}

function setLeadDisplay() {
  if (!_ecgInst) return;
  const container = document.getElementById('ecg-12lead-container');
  const grid = container.querySelector('#_ecg_leadsGrid');
  if (grid) grid.style.display = _show12Lead ? 'grid' : 'none';
}

function toggleLead() {
  _show12Lead = !_show12Lead;
  setLeadDisplay();
  updateEcgBar();
}

// --- Limb-lead cycling for monitoring-only mode (before 12-lead applied) --
// CAVEAT: this reaches into ecg_engine.js's internal DOM structure
// (.lead-cell / .lead-label-tag / #_ecg_leadsGrid) rather than a documented
// public API, because the engine only exposes a fixed Lead-II strip or the
// full 12-lead grid. If that internal markup changes, this will silently
// stop working. Worth adding a real setSingleLead() method to the engine
// itself if this becomes a permanent feature rather than a stopgap.
const limbLeadOrder = ['I', 'II', 'III', 'aVR', 'aVL', 'aVF'];
let _limbLeadIndex = 1; // start on 'II'

function cycleLimbLead() {
  if (actionState.ecg.status !== 'done' || actionState.ecg12lead.status === 'done') return;
  _limbLeadIndex = (_limbLeadIndex + 1) % limbLeadOrder.length;
  showLimbLead(limbLeadOrder[_limbLeadIndex]);
}

// Recomputes the engine's own cell-size formula (LEAD_W/LEAD_H) fresh each
// time, rather than caching, so it stays correct across instance rebuilds
// (ensureECG destroys/recreates the whole DOM whenever the rhythm changes).
function computeLeadCellSize() {
  const wrap = document.getElementById('ecg-display-wrap');
  const monitorW = wrap.clientWidth || 856;
  const totalH = wrap.clientHeight || 470;
  return { w: Math.floor(monitorW / 4), h: Math.floor(totalH * 0.70 / 3) };
}

function showLimbLead(name) {
  if (!_ecgInst) return;
  const { w, h } = computeLeadCellSize();
  const container = document.getElementById('ecg-12lead-container');
  const grid = container.querySelector('#_ecg_leadsGrid');
  const strip = container.querySelector('#_ecg_stripWrapper');
  if (!grid) return;
  grid.style.display = 'flex';
  grid.style.alignItems = 'center';
  grid.style.justifyContent = 'center';
  grid.style.width = '100%';
  grid.style.height = '100%';
  grid.querySelectorAll('.lead-cell').forEach(cell => {
    const tag = cell.querySelector('.lead-label-tag');
    const match = tag && tag.textContent.trim() === name;
    const canvas = cell.querySelector('canvas');
    cell.style.width = w + 'px';
    cell.style.height = h + 'px';
    cell.style.position = 'relative';
    if (match) {
      cell.style.display = 'block';
    } else {
      cell.style.display = 'none';
    }
    if (canvas) { canvas.style.width = ''; canvas.style.height = ''; }
  });
  if (strip) strip.style.display = 'none';
  document.getElementById('ecg-bar-label').textContent = `LEAD ${name} (tap to cycle)`;
}

function resetGridInlineStyles() {
  if (!_ecgInst) return;
  const { w, h } = computeLeadCellSize();
  const container = document.getElementById('ecg-12lead-container');
  const grid = container.querySelector('#_ecg_leadsGrid');
  if (!grid) return;
  grid.style.display = '';
  grid.style.alignItems = '';
  grid.style.justifyContent = '';
  grid.style.width = '';
  grid.style.height = '';
  grid.querySelectorAll('.lead-cell').forEach(cell => {
    cell.style.display = '';
    cell.style.position = '';
    cell.style.transform = '';
    cell.style.width = w + 'px';
    cell.style.height = h + 'px';
    const canvas = cell.querySelector('canvas');
    if (canvas) { canvas.style.width = ''; canvas.style.height = ''; }
  });
  const strip = container.querySelector('#_ecg_stripWrapper');
  if (strip) strip.style.display = '';
}

function ecgBarBtnClick() {
  const ecg12St = actionState.ecg12lead;
  if (ecg12St.status === 'done') { toggleLead(); return; }
  if (ecg12St.status === 'idle') { startAction('ecg12lead'); }
}

function updateEcgBar() {
  const btn = document.getElementById('leadToggleBtn');
  const label = document.getElementById('ecg-bar-label');
  const ecg12St = actionState.ecg12lead;
  const ecgDone = actionState.ecg.status === 'done';
  if (ecg12St.status === 'done') {
    btn.textContent = _show12Lead ? 'Show Lead II' : 'Show 12-Lead';
    btn.disabled = false;
    label.textContent = _show12Lead ? '12-LEAD ECG' : 'LEAD II \u2014 RHYTHM STRIP';
  } else {
    if (ecg12St.status === 'pending') {
      btn.textContent = `Applying\u2026 ${countdownRemain(ecg12St)}s`;
      btn.disabled = true;
    } else if (ecg12St.status === 'queued') {
      btn.textContent = 'Queued\u2026';
      btn.disabled = true;
    } else {
      btn.textContent = 'Apply 12-Lead ECG';
      btn.disabled = false;
    }
    // While monitoring ECG isn't done, show not-applied state. Once it IS done,
    // showLimbLead() owns the label (cycling hint) — leave it alone here.
    if (!ecgDone) label.textContent = 'ECG NOT APPLIED';
  }
}

function updateEcgMain(hr) {
  const overlay = document.getElementById('ecg-apply-overlay');
  const banner = document.getElementById('ecg-progress-banner');
  const ecgSt = actionState.ecg;
  const ecg12St = actionState.ecg12lead;

  if (ecgSt.status === 'done') {
    // Lead II (or a cycled limb lead) is already visible — never cover it.
    // A pending/queued 12-lead only gets a thin non-blocking banner.
    overlay.style.display = 'none';
    ensureECG(hr);
    if (ecg12St.status === 'done') {
      setLeadDisplay();
      banner.style.display = 'none';
    } else {
      showLimbLead(limbLeadOrder[_limbLeadIndex]);
      if (ecg12St.status === 'pending') {
        banner.style.display = 'block';
        banner.textContent = `Applying 12-Lead ECG\u2026 ${countdownRemain(ecg12St)}s`;
      } else if (ecg12St.status === 'queued') {
        banner.style.display = 'block';
        banner.textContent = '12-Lead ECG queued\u2026 crew busy';
      } else {
        banner.style.display = 'none';
      }
    }
  } else {
    banner.style.display = 'none';
    overlay.style.display = 'flex';
    if (ecgSt.status === 'pending') {
      overlay.innerHTML = `<div class="ecg-overlay-text">Applying ECG (Monitoring Leads)\u2026 ${countdownRemain(ecgSt)}s</div>`;
    } else if (ecgSt.status === 'queued') {
      overlay.innerHTML = `<div class="ecg-overlay-text">ECG queued\u2026 crew busy</div>`;
    } else if (ecg12St.status === 'pending') {
      overlay.innerHTML = `<div class="ecg-overlay-text">Applying 12-Lead ECG\u2026 ${countdownRemain(ecg12St)}s</div>`;
    } else if (ecg12St.status === 'queued') {
      overlay.innerHTML = `<div class="ecg-overlay-text">12-Lead ECG queued\u2026 crew busy</div>`;
    } else {
      overlay.innerHTML = `<button class="apply-btn-lg" onclick="startAction('ecg')">Apply ECG (Monitoring Leads)</button>`;
    }
  }
  updateEcgBar();
}

function fmtTimer(ms) {
  const s = Math.floor(ms / 1000);
  const mm = String(Math.floor(s / 60)).padStart(2, '0');
  const ss = String(s % 60).padStart(2, '0');
  return `${mm}:${ss}`;
}

function cellFor(actionKey) {
  const st = actionState[actionKey];
  if (st.status === 'idle') return `<button class="apply-btn" onclick="startAction('${actionKey}')">Apply</button>`;
  if (st.status === 'queued') return `<span class="queued-txt">Queued\u2026</span>`;
  return `<span class="pending-txt">${countdownRemain(st)}s</span>`;
}

function renderBPCell(now) {
  const st = actionState.bp;
  if (st.status === 'idle') return `<button class="apply-btn" onclick="startAction('bp')">Take BP</button>`;
  if (st.status === 'queued') return `<span class="queued-txt">Queued\u2026</span>`;
  if (st.status === 'pending') {
    const p = computeCuffPressure(st, now);
    return `${p}<span class="vunit">mmHg</span><div id="bp-timer">cuff inflating\u2026</div>`;
  }
  const remainMs = Math.max(0, (bpNextDueMs || now) - now);
  return `${lastBP.sys}/${lastBP.dia}<span class="vunit">mmHg</span><div id="bp-timer">next auto BP in ${fmtTimer(remainMs)}</div>`;
}

function renderMonitor(v, now) {
  const box = document.getElementById('monitor-box');
  const ecgDone = actionState.ecg.status === 'done';
  const hrCell = ecgDone ? `${v.HR}<span class="vunit">bpm</span>` : cellFor('ecg');
  const rrCell = ecgDone ? `${v.RR}<span class="vunit">/min</span>` : cellFor('ecg');
  const spo2Cell = actionState.spo2.status === 'done' ? `${v.SpO2}<span class="vunit">%</span>` : cellFor('spo2');
  const etco2Cell = actionState.etco2.status === 'done' ? `${v.EtCO2}<span class="vunit">mmHg</span>` : cellFor('etco2');
  const bpCell = renderBPCell(now);

  box.innerHTML = `
    <div class="vblock v-hr"><div class="vlabel">HR</div><div class="vvalue">${hrCell}</div></div>
    <div class="vblock v-bp"><div class="vlabel">NIBP</div><div class="vvalue">${bpCell}</div></div>
    <div class="vblock v-spo2"><div class="vlabel">SpO\u2082</div><div class="vvalue">${spo2Cell}</div></div>
    <div class="vblock v-rr"><div class="vlabel">Resp</div><div class="vvalue">${rrCell}</div></div>
    <div class="vblock v-etco2"><div class="vlabel">EtCO\u2082</div><div class="vvalue">${etco2Cell}</div></div>
  `;
}

function renderOneOff() {
  const strip = document.getElementById('oneoff-strip');
  strip.innerHTML = Object.entries(oneOffDefs).map(([key, def]) => {
    const st = actionState[key];
    let body;
    if (st.status === 'idle') {
      body = `<button class="oo-btn" onclick="startAction('${key}')">Assess</button>`;
    } else if (st.status === 'queued') {
      body = `<div class="oo-queued">Queued\u2026</div>`;
    } else if (st.status === 'pending') {
      body = `<div class="oo-pending">${countdownRemain(st)}s\u2026</div>`;
    } else {
      body = `<div class="oo-value">${st.value}${def.unit ? `<span style="font-size:9px"> ${def.unit}</span>` : ''}</div><button class="oo-btn" onclick="reassess('${key}')">Reassess</button>`;
    }
    return `<div class="oo-card"><div class="oo-label">${def.label}</div>${body}</div>`;
  }).join('');
}

function tick() {
  const now = Date.now();
  checkActionTimers(now);

  const v = SimEngine.getVitals(testConfig, now);
  renderMonitor(v, now);
  updateEcgMain(v.HR);
  renderOneOff();
  _lastHR = v.HR;
  document.getElementById('scenario-timer').textContent = fmtTimer(now - testConfig.startTimeMs);
}

tick();
setInterval(tick, 1000);

window.addEventListener('resize', () => {
  _currentRhythmKey = null;
  if (actionState.ecg.status === 'done') ensureECG(_lastHR);
});
</script>
</body>
</html>
